spring:
  cache:
    type: caffeine
    cache-names: users
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=600s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/freemaps
          audiences:
            - freemaps-api
  config:
    import: optional:file:.env.properties

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  application:
    name: freemaps

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
